<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nandhana C Reghu | Portfolio</title>
<style>
/* ===== THEME COLORS: edit here ===== */
:root{--bg:#0b0f1a;--card:#131a2b;--tx:#e8ecf5;--mu:#93a0b8;--a:#38e0c4;--b:#8b7cff;--bd:#222c44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#f5f7fb;--card:#fff;--tx:#12182b;--mu:#5b6780;--a:#0a9d92;--b:#6d5cf0;--bd:#dde3f0}
html{scroll-behavior:smooth;scroll-padding-top:60px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:12px 5%;border-bottom:1px solid var(--bd);background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:1.15rem;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px}
nav a{padding:7px 13px;border-radius:99px;color:var(--mu);font-size:.92rem;transition:.25s}
nav a:hover{color:var(--tx)}
nav a.on{background:linear-gradient(90deg,var(--a),var(--b));color:#06101a;font-weight:600}
.tools{display:flex;gap:8px}
.ic{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--bd);background:var(--card);border-radius:10px;transition:.25s}
.ic:hover{transform:translateY(-2px);border-color:var(--a);color:var(--a)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 11px;font-size:1rem;transition:.25s}
button:hover{transform:translateY(-2px);border-color:var(--a)}
#burger{display:none}
main{display:block}
.win{padding:80px 5%;min-height:92vh;display:flex;align-items:center}
.wrap{max-width:1050px;width:100%;margin:auto}
h2{font-size:clamp(1.7rem,4vw,2.4rem);margin-bottom:6px}
h2 span,.hl{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin-bottom:26px}
.rv{opacity:0}.rv.in{animation:up .7s both;animation-delay:calc(var(--i,0)*80ms)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{50%{transform:translateY(-10px)}}
/* Home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;min-height:70vh}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.1;margin:6px 0}
.role{font-size:1.3rem;height:2em;color:var(--a);font-weight:600;transition:opacity .35s}
.hero p{color:var(--mu);max-width:520px;margin:10px 0 22px}
.btn{display:inline-block;padding:11px 24px;border-radius:99px;margin:0 8px 8px 0;font-weight:600;border:1px solid var(--bd);transition:.25s}
.btn.p{background:linear-gradient(90deg,var(--a),var(--b));color:#06101a;border:0}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px #38e0c433}
.ph{position:relative;width:min(340px,78vw);margin:auto;animation:float 5s ease-in-out infinite;padding-top:8%}
.ph::before{content:"";position:absolute;left:0;right:0;bottom:0;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 70px #8b7cff55}
.ph img{position:relative;display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:var(--a);box-shadow:0 10px 30px #0004}
.card h3{font-size:1.1rem;margin-bottom:4px}
.meta{color:var(--a);font-size:.85rem;margin-bottom:8px}
.card ul{padding-left:18px;color:var(--mu);font-size:.95rem}
.card li{margin:4px 0}
.chip{display:inline-block;margin:4px 4px 0 0;padding:4px 12px;border-radius:99px;font-size:.85rem;background:var(--bg);border:1px solid var(--bd);transition:.2s}
.chip:hover{border-color:var(--b);color:var(--b)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px}
.stats .card{flex:1;min-width:130px;text-align:center}
.stats b{font-size:1.8rem;display:block}
.tl{border-left:2px solid var(--bd);padding-left:20px;display:grid;gap:16px}
.contact a.card{display:block}
footer{border-top:1px solid var(--bd);padding:36px 5% calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mu);font-size:.92rem}
footer .logo{font-size:1.3rem;display:inline-block;margin-bottom:6px}
footer .links{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:14px 0}
footer .links a{transition:.2s}footer .links a:hover{color:var(--a)}
@media(max-width:820px){
 #burger{display:block}
 nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:10px 5%;border-bottom:1px solid var(--bd);z-index:9}
 nav.open{display:flex;animation:fade .25s}
 .hero{grid-template-columns:1fr;text-align:center}.hero p{margin-inline:auto}
 .hero .ph{order:-1}
}
@media(prefers-reduced-motion:reduce){.rv{opacity:1!important}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

projects:`<div class="wrap"><h2 class="rv">My <span>Projects</span></h2><p class="sub rv" style="--i:1">Things I've built</p><div class="grid">${R(D.projects,(p,i)=>`<div class="card rv" style="--i:${i+2}"><h3>${p.t}</h3><div class="meta">${p.tech}</div>${ul(p.p)}<p style="margin-top:12px"><a class="hl" href="${p.link}" target="_blank" rel="noopener">GitHub →</a></p></div>`)}</div></div>`,

contact:`<div class="wrap contact"><h2 class="rv">Get In <span>Touch</span></h2><p class="sub rv" style="--i:1">Open to Data Science, Gen AI and Software Development roles</p><div class="grid">${R(D.contact,(c,i)=>`<a class="card rv" style="--i:${i+2}" href="${c[3]}" target="_blank" rel="noopener"><div style="font-size:1.6rem">${c[0]}</div><h3>${c[1]}</h3><p style="color:var(--mu);word-break:break-all">${c[2]}</p></a>`)}</div></div>`

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===e.target.id))}),{rootMargin:"-45% 0px -50% 0px"});

function setTheme(t){document.documentElement.dataset.theme=t;$("#theme").textContent=t==="dark"?"🌙":"☀️";try{localStorage.setItem("theme",t)}catch(e){}}
